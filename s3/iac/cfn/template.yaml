AWSTemplateFormatVersion: 2010-09-09
Description: >-
  This template creates the S3 Bucket for the Solution
Resources:
  S3Bucket:
    # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-s3-bucket.html#aws-resource-s3-bucket--examples
    Type: 'AWS::S3::Bucket'
    # We don't need to supply a bucket name as AWS will randomly generate one
   